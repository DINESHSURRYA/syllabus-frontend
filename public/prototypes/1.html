<!DOCTYPE html>
<html lang="en" x-data="{ darkMode: false }" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to P N R Syllabus Portal</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        navy: {
                            800: '#0f172a',
                            900: '#0a0f1d',
                            950: '#050811',
                        },
                        indigo: {
                            500: '#6366f1',
                            600: '#4f46e5',
                        },
                        emerald: {
                            400: '#34d399',
                            500: '#10b981',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            cursor: none;
        }
        
        #custom-cursor {
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
            transition: transform 0.08s ease-out;
            will-change: transform;
        }

        #custom-cursor-follower {
            pointer-events: none;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9998;
            transition: transform 0.25s cubic-bezier(0.18, 0.89, 0.32, 1.28), width 0.2s, height 0.2s, opacity 0.2s;
            will-change: transform;
        }

        /* Ambient Glow & Glassmorphism */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased h-screen overflow-hidden flex items-center justify-center relative selection:bg-indigo-500 selection:text-white"
      x-data="splashApp()">

    <!-- Custom Cursor -->
    <div id="custom-cursor" class="flex items-center justify-center pointer-events-none">
        <div class="p-1 bg-emerald-500 rounded-full text-slate-950 shadow-lg shadow-emerald-500/50 flex items-center justify-center">
            <i data-lucide="compass" class="w-4 h-4"></i>
        </div>
    </div>
    <div id="custom-cursor-follower" class="w-8 h-8 rounded-full border-2 border-emerald-400/50 bg-emerald-400/10 pointer-events-none"></div>

    <!-- Ambient Glowing Background Spheres -->
    <div class="absolute top-1/4 left-1/3 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-600/30 blur-[140px] rounded-full pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/3 translate-x-1/2 translate-y-1/2 w-[450px] h-[450px] bg-emerald-500/20 blur-[140px] rounded-full pointer-events-none"></div>

    <!-- Dark Mode Toggle (Top Right) -->
    <div class="absolute top-6 right-6 z-50">
        <button @click="darkMode = !darkMode" class="p-3 rounded-2xl glass-panel text-amber-400 hover:scale-105 transition-all cursor-hover shadow-lg">
            <i data-lucide="sun" class="w-5 h-5" x-show="darkMode"></i>
            <i data-lucide="moon" class="w-5 h-5 text-slate-700" x-show="!darkMode"></i>
        </button>
    </div>

    <!-- MAIN SPLASH CARD -->
    <div class="relative z-10 w-full max-w-lg mx-4">
        <div class="glass-panel rounded-3xl p-8 sm:p-10 shadow-2xl shadow-indigo-950/50 text-center border border-white/10 relative overflow-hidden">
            
            <!-- Top Logo Badge -->
            <div class="inline-flex items-center justify-center p-3.5 bg-gradient-to-tr from-indigo-600 to-emerald-500 text-white rounded-2xl shadow-lg shadow-indigo-500/30 mb-6">
                <i data-lucide="book-open-check" class="w-8 h-8"></i>
            </div>

            <!-- Header -->
            <div class="text-xs font-bold uppercase tracking-widest text-emerald-400 mb-2">Academic Session 2026</div>
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-3">
                P N R <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-emerald-400">Syllabus Portal</span>
            </h1>
            <p class="text-slate-300 text-sm mb-8 leading-relaxed">
                Select your academic track to load localized regulation guidelines and course outcomes.
            </p>

            <!-- SPLASH FORM / SELECTORS -->
            <div class="space-y-4 text-left">
                
                <!-- Role / Track Selection -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">I am accessing as:</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button @click="role = 'student'" 
                                :class="role === 'student' ? 'bg-indigo-600 text-white border-indigo-500 shadow-lg shadow-indigo-600/30' : 'bg-slate-800/80 text-slate-300 border-slate-700/60 hover:bg-slate-800'"
                                class="py-2.5 px-4 rounded-xl border text-xs font-bold flex items-center justify-center gap-2 transition-all cursor-hover">
                            <i data-lucide="user" class="w-4 h-4"></i>
                            Student
                        </button>
                        <button @click="role = 'faculty'" 
                                :class="role === 'faculty' ? 'bg-indigo-600 text-white border-indigo-500 shadow-lg shadow-indigo-600/30' : 'bg-slate-800/80 text-slate-300 border-slate-700/60 hover:bg-slate-800'"
                                class="py-2.5 px-4 rounded-xl border text-xs font-bold flex items-center justify-center gap-2 transition-all cursor-hover">
                            <i data-lucide="award" class="w-4 h-4"></i>
                            Faculty
                        </button>
                    </div>
                </div>

                <!-- Preferred Department Selection -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Primary Department:</label>
                    <div class="relative">
                        <select x-model="selectedDept" class="w-full py-3 px-4 bg-slate-800/90 border border-slate-700/70 rounded-xl text-slate-200 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-400 appearance-none cursor-hover">
                            <option value="CSE">Computer Science & Engineering (CSE)</option>
                            <option value="ECE">Electronics & Communication (ECE)</option>
                            <option value="MECH">Mechanical Engineering (MECH)</option>
                            <option value="CIVIL">Civil Engineering (CIVIL)</option>
                        </select>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-slate-400 absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                    </div>
                </div>

                <!-- ENTER PORTAL BUTTON -->
                <button @click="enterPortal()" 
                        :disabled="isRedirecting"
                        class="w-full mt-6 py-4 px-6 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-extrabold text-sm rounded-xl shadow-xl shadow-emerald-500/20 transition-all cursor-hover flex items-center justify-center gap-2 group">
                    <template x-if="!isRedirecting">
                        <span class="flex items-center gap-2">
                            <span>ENTER SYLLABUS PORTAL</span>
                            <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                        </span>
                    </template>
                    <template x-if="isRedirecting">
                        <span class="flex items-center gap-2">
                            <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
                            <span>Preparing Environment...</span>
                        </span>
                    </template>
                </button>
            </div>

            <!-- Footer Note / Disclaimer -->
            <div class="mt-8 pt-6 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-400">
                <span class="flex items-center gap-1"><i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-400"></i> Autonomous Reg 2026</span>
                <a href="#" @click.prevent="alert('Directing to institutional guest access...')" class="underline hover:text-slate-200 transition-colors cursor-hover">Skip to Guest View</a>
            </div>

        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        function splashApp() {
            return {
                role: 'student',
                selectedDept: 'CSE',
                isRedirecting: false,

                enterPortal() {
                    this.isRedirecting = true;
                    setTimeout(() => {
                        // Redirect to main portal (e.g., index.html)
                        window.location.href = `index.html?dept=${this.selectedDept}&role=${this.role}`;
                    }, 1200);
                }
            }
        }

        // Custom Cursor Logic
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            const cursor = document.getElementById('custom-cursor');
            const follower = document.getElementById('custom-cursor-follower');

            let mouseX = 0, mouseY = 0;
            let followerX = 0, followerY = 0;

            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                cursor.style.transform = `translate3d(${mouseX - 12}px, ${mouseY - 12}px, 0)`;
            });

            function animateFollower() {
                followerX += (mouseX - followerX) * 0.15;
                followerY += (mouseY - followerY) * 0.15;
                follower.style.transform = `translate3d(${followerX - 16}px, ${followerY - 16}px, 0)`;
                requestAnimationFrame(animateFollower);
            }
            animateFollower();

            const interactiveElements = document.querySelectorAll('.cursor-hover, button, select, a');
            interactiveElements.forEach(el => {
                el.addEventListener('mouseenter', () => {
                    follower.style.width = '48px';
                    follower.style.height = '48px';
                    follower.style.opacity = '0.6';
                    follower.style.borderColor = '#10b981';
                });
                el.addEventListener('mouseleave', () => {
                    follower.style.width = '32px';
                    follower.style.height = '32px';
                    follower.style.opacity = '1';
                    follower.style.borderColor = 'rgba(52, 211, 153, 0.5)';
                });
            });
        });
    </script>
</body>
</html>
